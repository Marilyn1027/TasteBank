    background-size: 10px 10px; background-position: 0 -4px; opacity:0.9;

const typeMeta = {
  "classic": "经典黑巧 / 单一产地控",
  "adventure": "猎奇风味探索者",
  "dairy": "乳制品 / 白巧党",
  "rare": "名庄珍稀豆收藏党",
  "raw": "生豆 / 烘焙原料党",
  "boozy": "酒心 / 发酵实验党"
};

let activeCountry = "全部";
let activeType = "全部";

function uniq(arr){ return [...new Set(arr)]; }

function renderStats(){
  document.getElementById('statCount').textContent = DATA.length;
  document.getElementById('statCountry').textContent = uniq(DATA.map(d=>d.country)).length;
  const total = DATA.reduce((s,d)=> s + parseFloat(d.price.replace('¥','')), 0);
  document.getElementById('statSpend').textContent = '¥' + Math.round(total);
}

// order countries by frequency so common ones appear first
function orderedCountries(){
  const counts = {};
  DATA.forEach(d=> counts[d.country] = (counts[d.country]||0) + 1);
  return Object.keys(counts).sort((a,b)=> counts[b]-counts[a]);
}

function renderChips(){
  const countries = ["全部", ...orderedCountries()];
  const countryWrap = document.getElementById('countryChips');
  countryWrap.innerHTML = countries.map(c =>
    `<button class="chip ${c===activeCountry?'active':''}" data-country="${c}">${c}</button>`
  ).join('');

  const types = ["全部", ...Object.keys(typeMeta)];
  const typeWrap = document.getElementById('typeChips');
  typeWrap.innerHTML = types.map(t =>
    `<button class="chip ${t===activeType?'active':''}" data-type="${t}">${t==='全部'?'全部':typeMeta[t]}</button>`
  ).join('');

  countryWrap.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeCountry = btn.dataset.country;
      renderChips(); renderGrid();
    });
  });
  typeWrap.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeType = btn.dataset.type;
      renderChips(); renderGrid();
    });
  });
}

function renderGrid(){
  const filtered = DATA.filter(d=>{
    const cOk = activeCountry === "全部" || d.country === activeCountry;
    const tOk = activeType === "全部" || d.type === activeType;
    return cOk && tOk;
  });

  document.getElementById('resultNum').textContent = filtered.length;
  const grid = document.getElementById('grid');

  if(filtered.length === 0){
    grid.style.display = 'block';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="glyph">🍫</div>
      <p>这个组合暂时空空如也<br>换个筛选条件试试？</p>
    </div>`;
    return;
  }
  grid.style.display = 'grid';

  grid.innerHTML = filtered.map((d) => `
    <div class="card type-${d.type}" data-idx="${DATA.indexOf(d)}">
      <div class="pct-stamp">${d.pct}</div>
      <div class="country-tag">${d.countryTag} · ${d.country}</div>
      <div class="brand">${d.brand}</div>
      <div class="product">${d.product}</div>
      <div class="origin">${d.origin}</div>
      <span class="suited-pill">${d.tags[0]}</span>
      <div class="price">实付 ${d.price}</div>
    </div>
  `).join('');

  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=> openSheet(DATA[card.dataset.idx]));
  });
}

function openSheet(d){
  document.getElementById('sCountry').textContent = `${d.countryTag} · ${d.country}`;
  document.getElementById('sBrand').textContent = d.brand;
  document.getElementById('sProduct').textContent = d.product;
  document.getElementById('sOrigin').textContent = d.origin;
  document.getElementById('sFlavor').textContent = d.flavor;
  document.getElementById('sWho').textContent = d.who;
  document.getElementById('sPrice').textContent = d.price;
  document.getElementById('sTags').innerHTML = d.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  document.getElementById('overlay').classList.add('show');
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('closeBtn').addEventListener('click', closeSheet);
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeSheet();
});

renderStats();
renderChips();
renderGrid();
</script>
